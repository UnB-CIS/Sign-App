# Pipeline de integração contínua do Sign-App
name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  # Verificações de qualidade: tipagem, testes e lint
  checks:
    name: Lint, Tipos e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      # Não-bloqueante: ainda existem erros baseline de tipagem
      - name: Verificação de tipos (tsc)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Testes (jest)
        run: npx jest --ci

      # Não-bloqueante por enquanto
      - name: Lint (eslint)
        run: npx eslint .
        continue-on-error: true

  # Build manual do APK de debug, disparado sob demanda
  android-build:
    name: Build APK de Debug
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
